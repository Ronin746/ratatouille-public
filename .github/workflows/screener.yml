name: Ratatouille Screener

on:
  # Esegui automaticamente dal lunedì al venerdì alle 22:05 UTC
  # (= 23:05 CET / 00:05 CEST — dopo la chiusura di Wall Street)
  schedule:
    - cron: '5 22 * * 1-5'

  # Avvio manuale dalla tab "Actions" su GitHub
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # serve per il commit di ritorno

      # ── 2. Python ──────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: Screener/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r Screener/requirements.txt

      # ── 3. Screener ────────────────────────────────────────────────────────
      - name: Run screener
        working-directory: Screener
        run: python scheduler_app.py --now
        env:
          # Opzionale: se usi email_manager.py con Gmail
          EMAIL_USER:     ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

      # ── 4. Build Archive ───────────────────────────────────────────────────
      - name: Build archive page
        working-directory: Screener
        run: python update_archive.py

      # ── 5. Commit nuovi report/dati nel repo ───────────────────────────────
      - name: Commit new reports and data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Reports/ Data/ Archive/
          # Commette solo se ci sono modifiche
          git diff --cached --quiet || git commit -m "screener: $(date -u +'%Y-%m-%d')"
          git push

      # ── 6. Deploy su Cloudflare Pages ─────────────────────────────────────
      - name: Deploy to Cloudflare Pages
        working-directory: .
        run: python deploy_to_cloudflare.py
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN:  ${{ secrets.CF_API_TOKEN }}
