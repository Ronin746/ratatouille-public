name: Ratatouille Screener

on:
  # Due trigger per coprire CET (inverno) e CEST (estate):
  # Esecuzione alle 8:00 ora italiana, da martedì a sabato:
  #   8:00 CET  = 7:00 UTC (inverno, ultima dom ottobre – ultima dom marzo)
  #   8:00 CEST = 6:00 UTC (estate, ultima dom marzo – ultima dom ottobre)
  # Il guard step qui sotto garantisce che solo il trigger corretto proceda.
  schedule:
    - cron: '0 7 * * 2-6'    # CET  (inverno) — 8:00 ora italiana
    - cron: '0 6 * * 2-6'    # CEST (estate)  — 8:00 ora italiana

  # Avvio manuale dalla tab "Actions" su GitHub (bypassa il guard)
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # necessario per git push dei nuovi report

    steps:
      # ── 0. Guard: procedi solo se sono le 8:xx ora italiana ──
      - name: Check Italian morning 8AM
        id: guard
        run: |
          python3 - <<'EOF'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os

          it_now  = datetime.now(ZoneInfo("Europe/Rome"))
          hour    = it_now.hour
          proceed = 7 <= hour < 9

          print(f"Italy time: {it_now.strftime('%H:%M')} — proceed: {proceed}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"proceed={str(proceed).lower()}\n")
          EOF

      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        if: steps.guard.outputs.proceed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Python ──────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        if: steps.guard.outputs.proceed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: Screener/requirements.txt

      - name: Install dependencies
        if: steps.guard.outputs.proceed == 'true' || github.event_name == 'workflow_dispatch'
        run: pip install -r Screener/requirements.txt

      # ── 3. Screener ────────────────────────────────────────────────────────
      - name: Run screener
        if: steps.guard.outputs.proceed == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: Screener
        run: python scheduler_app.py --now
        env:
          EMAIL_USER:     ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

      # ── 4. Build Archive ───────────────────────────────────────────────────
      - name: Build archive page
        if: steps.guard.outputs.proceed == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: Screener
        run: python update_archive.py

      # ── 5. Commit nuovi report/dati nel repo ───────────────────────────────
      # Cloudflare Pages rileva il push e deploya Archive/ automaticamente
      - name: Commit new reports and data
        if: steps.guard.outputs.proceed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Reports/ Archive/
          git diff --cached --quiet || git commit -m "screener: $(date -u +'%Y-%m-%d')"
          git push
